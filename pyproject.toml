[project]
name = "infra-agent-conformance"
version = "0.1.0"
description = "Security and reliability conformance testing for infrastructure agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Mostafa Tavassoli" }]
dependencies = [
  "jsonschema>=4.23.0,<5",
  "opentelemetry-api>=1.28.0,<2",
  "pydantic>=2.10.0,<3",
  "pyyaml>=6.0.2,<7",
  "rich>=13.9.0,<15",
  "typer>=0.15.0,<1",
]

[project.scripts]
infra-conformance = "infra_conformance.cli:app"

[project.entry-points."devops_bench.metrics"]
infra_agent_security = "infra_conformance.integrations.devops_bench:AdversarialTelemetryMetric"

[dependency-groups]
dev = [
  "mypy>=1.13.0,<2",
  "pytest>=8.3.0,<10",
  "ruff>=0.8.0,<1",
  "types-jsonschema>=4.23.0,<5",
  "types-pyyaml>=6.0.12,<7",
]
docs = ["mkdocs>=1.6.0,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infra_conformance"]

[tool.hatch.build]
include = [
  "src/infra_conformance/contracts/*.json",
  "src/infra_conformance/profiles/*.yaml",
  "src/infra_conformance/py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["infra_conformance"]
